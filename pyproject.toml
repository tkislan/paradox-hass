[project]
name = "paradox-hass"
version = "0.0.0"
requires-python = ">=3.14.2"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.373",
    "ruff==0.17.1",
    "mypy==2.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
empty_parameter_set_mark = "fail_at_collect"
testpaths = ["tests"]
addopts = "--timeout=30 --cov=custom_components.paradox --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN401", "COM812", "CPY001", "D1", "D203", "D212", "EM101", "EM102", "ISC001", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "PLR0913", "PLR2004", "S101", "SLF001"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components"]
