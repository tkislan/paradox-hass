name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write the release tag into the manifest
        run: |
          version="$GITHUB_REF_NAME"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The tag $GITHUB_REF_NAME is not a version such as 0.2.0 or 0.2.0-rc.1, without a leading v"
            exit 1
          fi
          jq --arg v "$version" '.version = $v' custom_components/paradox/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/paradox/manifest.json
      - name: Zip the integration
        run: |
          cd custom_components/paradox
          zip -r "$GITHUB_WORKSPACE/paradox.zip" . -x '*__pycache__/*'
      - name: Attach the zip to the release
        run: gh release upload "$GITHUB_REF_NAME" "$GITHUB_WORKSPACE/paradox.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
